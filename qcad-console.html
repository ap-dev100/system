<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCAD Console — Group Quality Assurance</title>
<style>
:root{
  --bg:#ffffff;
  --ink:#111111;
  --ink-soft:#5b5b5b;
  --ink-faint:#9a9a9a;
  --line:#dcdcdc;
  --line-strong:#b7b7b7;
  --fill:#f4f4f4;
  --sidebar:#070707;
  --sidebar-line:#242424;
  --sidebar-ink:#cfcfcf;
  --sidebar-ink-dim:#7a7a7a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}
.app{display:flex;min-height:100vh;}

.sidebar{width:264px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:24px 22px 16px;border-bottom:1px solid var(--sidebar-line);}
.brand-mark{font-family:var(--serif);font-size:18px;color:#fff;letter-spacing:.01em;}
.brand-sub{font-size:10.7px;color:var(--sidebar-ink-dim);margin-top:5px;}
.nav{flex:1;padding:10px 8px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;background:none;border:none;color:var(--sidebar-ink);font-size:12.6px;text-align:left;cursor:pointer;border-left:2px solid transparent;font-family:var(--sans);}
.nav-item:hover{color:#fff;}
.nav-item.active{color:#fff;border-left-color:#fff;background:rgba(255,255,255,.06);}
.nav-mono{width:28px;height:19px;border:1px solid var(--sidebar-line);display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.02em;color:var(--sidebar-ink-dim);flex-shrink:0;}
.nav-item.active .nav-mono{border-color:#fff;color:#fff;}
.sidebar-foot{padding:14px 22px;border-top:1px solid var(--sidebar-line);font-size:11px;color:var(--sidebar-ink-dim);}
.sidebar-foot .who{color:#e6e6e6;font-size:12px;margin-bottom:2px;}

.main{flex:1;min-width:0;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:28px 40px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.topbar h1{font-family:var(--serif);font-weight:400;font-size:25px;margin:0;}
.topbar .desc{font-size:13px;color:var(--ink-soft);margin-top:6px;max-width:660px;}
.topbar .actions{display:flex;gap:10px;flex-shrink:0;padding-top:2px;flex-wrap:wrap;}
.content{padding:32px 40px 90px;max-width:1180px;}

.btn{font-family:var(--sans);font-size:13px;padding:9px 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;white-space:nowrap;}
.btn:hover{background:#000;}
.btn-outline{background:transparent;color:var(--ink);border:1px solid var(--line-strong);}
.btn-outline:hover{border-color:var(--ink);}
.btn-small{padding:5px 11px;font-size:12px;}
.btn-full{width:100%;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:38px;}
.kpi{padding:20px 22px;border-left:1px solid var(--line);}
.kpi:first-child{border-left:none;}
.kpi .num{font-family:var(--serif);font-size:28px;font-variant-numeric:tabular-nums;}
.kpi .label{font-size:11.6px;color:var(--ink-soft);margin-top:5px;}
.kpi .delta{font-size:11px;margin-top:7px;color:var(--ink-faint);}

.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:44px 0 14px;flex-wrap:wrap;gap:6px;}
.section-head h2{font-family:var(--serif);font-weight:400;font-size:18px;margin:0;}
.section-head .hint{font-size:11.8px;color:var(--ink-faint);}

.chart-wrap{border:1px solid var(--line);padding:22px 24px 16px;}
.legend{display:flex;gap:20px;font-size:12px;color:var(--ink-soft);margin-top:12px;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.swatch{width:10px;height:10px;display:inline-block;border:1px solid var(--ink);}

.table-wrap{overflow-x:auto;border-bottom:1px solid var(--line);}
table.ledger{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
table.ledger th{text-align:left;font-weight:500;color:var(--ink-soft);font-size:11.2px;padding:0 14px 10px;border-bottom:1px solid var(--ink);white-space:nowrap;}
table.ledger td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
table.ledger tbody tr{cursor:pointer;}
table.ledger tbody tr:hover{background:var(--fill);}
table.ledger td.num, table.ledger th.num{text-align:right;font-variant-numeric:tabular-nums;}
.tag{display:inline-block;font-size:10.6px;padding:2.5px 8px;border:1px solid var(--ink);white-space:nowrap;}
.tag.dim{border-color:var(--line-strong);color:var(--ink-soft);}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);}
.dash-card{background:#fff;padding:20px;cursor:pointer;}
.dash-card:hover{background:var(--fill);}
.dash-card .mono{width:32px;height:22px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:9.5px;margin-bottom:14px;}
.dash-card h4{font-family:var(--serif);font-weight:400;font-size:15px;margin:0 0 6px;}
.dash-card p{font-size:11.8px;color:var(--ink-soft);margin:0 0 12px;min-height:44px;}
.dash-card .metric{font-family:var(--serif);font-size:19px;}
.dash-card .metric-label{font-size:10.8px;color:var(--ink-faint);}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;}
.modal{background:#fff;width:500px;max-width:100%;max-height:92vh;overflow-y:auto;padding:30px 32px;border:1px solid var(--ink);}
.modal h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 4px;}
.modal .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11.8px;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%;padding:9px 10px;border:1px solid var(--line-strong);font-family:var(--sans);font-size:13.5px;background:#fff;color:var(--ink);}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--ink);outline-offset:1px;}
.field textarea{min-height:70px;resize:vertical;}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:70;display:flex;justify-content:flex-end;}
.drawer{width:440px;max-width:94vw;background:#fff;height:100%;overflow-y:auto;padding:32px 34px;border-left:1px solid var(--ink);}
.drawer .eyebrow{font-size:11.5px;color:var(--ink-faint);margin-bottom:6px;}
.drawer h3{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 18px;}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;}
.kv .k{color:var(--ink-soft);flex-shrink:0;}
.kv .v{text-align:right;}
.drawer-actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;}
.close-x{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:0;}
.drawer-top{display:flex;justify-content:space-between;align-items:flex-start;}
.notice{border:1px solid var(--line-strong);padding:14px 16px;font-size:12.5px;color:var(--ink-soft);margin-top:18px;}
.mini-list{list-style:none;padding:0;margin:16px 0 0;}
.mini-list li{padding:11px 0;border-bottom:1px solid var(--line);font-size:12.8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}

.toast{position:fixed;bottom:26px;right:26px;background:#111;color:#fff;padding:13px 20px;font-size:13px;z-index:100;border:1px solid #000;}
.empty{padding:40px 0;text-align:center;color:var(--ink-faint);font-size:13px;border:1px dashed var(--line-strong);}
.menu-btn{display:none;border:1px solid var(--line-strong);background:#fff;padding:8px 10px;cursor:pointer;margin-right:12px;}
.title-row{display:flex;align-items:center;}
.lede{font-size:13px;color:var(--ink-soft);margin:-8px 0 26px;max-width:680px;}

@media (max-width:820px){
  .sidebar{position:fixed;z-index:60;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .topbar,.content{padding-left:20px;padding-right:20px;}
  .menu-btn{display:inline-flex !important;}
  .two-col{grid-template-columns:1fr;}
}

const $ = sel => document.querySelector(sel);

function toast(msg){
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ root.innerHTML=''; }, 2600);
}
function closeModal(){ $('#modal-root').innerHTML=''; }
function closeDrawer(){ $('#drawer-root').innerHTML=''; }

/* ============================= CHART ============================= */
function barChart(id, labels, series){
  const w = Math.max(600, labels.length*Math.max(78, series.length*44));
  const h = 205, padL=8, padB=30, padT=16, padR=8;
  const max = Math.max(1, ...series.flatMap(s=>s.values)) * 1.18;
  const groupW = (w-padL-padR)/labels.length;
  const barW = Math.min(28, (groupW-16)/series.length);
  let bars='';
  labels.forEach((lab,li)=>{
    const gx = padL + li*groupW + (groupW - (barW*series.length+(series.length-1)*6))/2;
    series.forEach((s,si)=>{
      const val = s.values[li];
      const bh = (val/max)*(h-padT-padB);
      const bx = gx + si*(barW+6);
      const by = h-padB-bh;
      const fillId = si===0? `url(#${id}-f0)` : si===1? `url(#${id}-f1)` : `url(#${id}-f2)`;
      bars += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(bh,0).toFixed(1)}" fill="${fillId}" stroke="#111" stroke-width="0.6"/>`;
      bars += `<text x="${(bx+barW/2).toFixed(1)}" y="${(by-5).toFixed(1)}" font-size="9" text-anchor="middle" fill="#5b5b5b" font-family="sans-serif">${s.fmt?s.fmt(val):val}</text>`;
    });
    bars += `<text x="${(gx + (barW*series.length+(series.length-1)*6)/2).toFixed(1)}" y="${h-10}" font-size="9.4" text-anchor="middle" fill="#5b5b5b" font-family="sans-serif">${lab}</text>`;
  });
  bars += `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#111" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
    <defs>
      <pattern id="${id}-f1" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="2.6"/></pattern>
      <pattern id="${id}-f0" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#111"/></pattern>
      <pattern id="${id}-f2" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#c7c7c7"/></pattern>
    </defs>
    ${bars}
  </svg>`;
}
function chartLegend(series){
  return `<div class="legend">${series.map((s,i)=>`<span><span class="swatch" style="background:${i===0?'#111':i===1?'repeating-linear-gradient(45deg,#111,#111 2px,#fff 2px,#fff 4px)':'#c7c7c7'}"></span>${s.name}</span>`).join('')}</div>`;
}

      build: v => { const s=+v.score||0; return {faculty:v.faculty||'Unnamed faculty', college:v.college, observer:v.observer||'QCAD Peer Reviewer', score:s, training: s<3.5?'Yes':'No', date:'Sep 2026'}; }
    },
    rowAction:{ label:'Flag training need', apply:(row)=>{ row.training='Yes'; toast('Training need flagged.'); } },
  },
};

/* ============================= DASHBOARD ============================= */
function renderDashboard(){
  const composite = state.auditPanels.map(r=>(r.academic+r.financial+r.operational)/3);
  const avgComposite = composite.reduce((a,v)=>a+v,0)/composite.length;
  const activeAlerts = state.riskAlerts.filter(r=>r.status==='Active').length;
  const overdueAudits = state.audits.filter(r=>r.status==='Overdue').length;
  const wbOpen = state.whistleblower.filter(r=>r.status!=='Resolved').length;

  const cards = [
    {id:'auditPanels', metric:avgComposite.toFixed(1), label:'Avg. composite score'},
    {id:'benchmarks', metric:pct(state.benchmarks.reduce((a,r)=>a+r.passRate,0)/state.benchmarks.length), label:'Avg. pass rate'},
    {id:'audits', metric:overdueAudits, label:'Overdue findings'},
    {id:'gradeAnomalies', metric:state.gradeAnomalies.filter(r=>r.flag==='Yes').length, label:'Modules flagged'},
    {id:'staffQual', metric:state.staffQual.filter(r=>r.status==='Expired').length, label:'Expired credentials'},
    {id:'retention', metric:pct(state.retention.reduce((a,r)=>a+r.dropout,0)/state.retention.length), label:'Avg. dropout rate'},
    {id:'syllabus', metric:state.syllabus.filter(r=>r.status==='Major gaps').length, label:'Major gap programs'},
    {id:'evaluations', metric:(state.evaluations.reduce((a,r)=>a+r.rating,0)/state.evaluations.length).toFixed(1), label:'Avg. rating'},
    {id:'riskAlerts', metric:activeAlerts, label:'Active risk alerts'},
    {id:'trends', metric:state.trends[state.trends.length-1].performance, label:'Latest performance index'},
    {id:'corrective', metric:state.corrective.filter(r=>r.status==='Overdue').length, label:'Overdue mandates'},
    {id:'policies', metric:state.policies.length, label:'Policies distributed'},
    {id:'extAudit', metric:state.extAudit.filter(r=>r.status==='Below').length, label:'Colleges below standard'},
    {id:'peerReview', metric:state.peerReview.filter(r=>r.training==='Yes').length, label:'Training needs flagged'},
    {id:'whistleblower', metric:wbOpen, label:'Open whistleblower cases'},
  ];

  return `
    <div class="kpi-row">
      <div class="kpi"><div class="num">${COLLEGES.length}</div><div class="label">Colleges under cross-tenant view</div></div>
      <div class="kpi"><div class="num">${avgComposite.toFixed(1)}</div><div class="label">Network composite score</div></div>
      <div class="kpi"><div class="num">${activeAlerts}</div><div class="label">Active compliance risk alerts</div></div>
      <div class="kpi"><div class="num">${overdueAudits}</div><div class="label">Overdue audit findings</div></div>
    </div>
    <div class="section-head"><h2>All modules</h2><span class="hint">15 areas of group oversight · click any card to open</span></div>
    <div class="dash-grid">
      ${cards.map(c=>{
        const t = TITLES[c.id];
        const nav = NAV.find(n=>n.id===c.id);
        return `<div class="dash-card" onclick="navigate('${c.id}')">
          <div class="mono">${nav.mono}</div>
          <h4>${t.title}</h4>
          <p>${t.desc}</p>
          <div class="metric">${c.metric}</div>
          <div class="metric-label">${c.label}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

/* ============================= SPECIAL VIEW: HISTORICAL TRENDS ============================= */
FEATURES.trends = {
  dataKey:'trends', tableTitle:'Yearly network readings',
  kpis: rows => {
    const latest = rows[rows.length-1], first = rows[0];
    return [
      {value:latest.performance, label:'Latest performance index'},
      {value:(latest.performance-rows[rows.length-2].performance>=0?'+':'')+(latest.performance-rows[rows.length-2].performance), label:'Year-over-year change'},
      {value:latest.compliance, label:'Latest compliance index'},
      {value:(latest.performance-first.performance>=0?'+':'')+(latest.performance-first.performance), label:'5-year change'},
    ];
  },
  chart: rows => ({labels: rows.map(r=>r.year), series:[
    {name:'Performance index', values:rows.map(r=>r.performance)},
    {name:'Compliance index', values:rows.map(r=>r.compliance)},
  ]}),
  columns:[
    {key:'year', label:'Year'},
    {key:'performance', label:'Performance index', align:'num'},
    {key:'compliance', label:'Compliance index', align:'num'},
  ],
  form:{ actionLabel:'+ Log historical data point', title:'Log historical data point', sub:'Add a network-wide yearly performance and compliance reading.',
    fields:[
      {key:'year', label:'Year', type:'text', placeholder:'e.g. 2027'},
      {key:'performance', label:'Performance index', type:'number'},
      {key:'compliance', label:'Compliance index', type:'number'},
    ],
    build: v => ({year:v.year||'—', performance:+v.performance||0, compliance:+v.compliance||0})
  },
};

/* ============================= SPECIAL VIEW: POLICY DISTRIBUTION ============================= */
function renderPolicies(){
  return `
    <div class="kpi-row">
      <div class="kpi"><div class="num">${state.policies.length}</div><div class="label">Policies distributed</div></div>
      <div class="kpi"><div class="num">${state.policies.filter(p=>p.status==='Fully acknowledged').length}</div><div class="label">Fully acknowledged</div></div>
      <div class="kpi"><div class="num">${state.policies.filter(p=>p.status==='Distributing').length}</div><div class="label">Still distributing</div></div>
      <div class="kpi"><div class="num">${COLLEGES.length}</div><div class="label">Tenant dashboards reached</div></div>
    </div>
    <div class="section-head"><h2>Distributed policies</h2><span class="hint">Click a policy to view acknowledgment by college</span></div>
    <div class="table-wrap"><table class="ledger"><thead><tr>
      <th>Title</th><th>Effective</th><th>Acknowledged</th><th>Status</th>
    </tr></thead><tbody>
      ${state.policies.map((p,i)=>{
        const ackCount = p.colleges.filter(c=>c.ack).length;
        return `<tr onclick="openPolicyDetail(${i})">
          <td>${p.title}</td><td>${p.effective}</td>
          <td class="num">${ackCount} / ${p.colleges.length}</td>
          <td>${p.status==='Fully acknowledged'?'<span class="tag">Fully acknowledged</span>':'<span class="tag dim">Distributing</span>'}</td>
        </tr>`;
      }).join('')}
    </tbody></table></div>
  `;
}
function openPolicyModal(){
  $('#modal-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>Push new policy</h3>
      <div class="sub">Distribute an updated quality guideline instantly to every selected tenant dashboard.</div>
      <form onsubmit="submitPolicy(event)">
        <div class="field"><label>Title</label><input name="title" required placeholder="e.g. Revised Academic Integrity Guidelines"></div>
        <div class="field"><label>Summary</label><textarea name="summary" required placeholder="What is changing, and why?"></textarea></div>
        <div class="field"><label>Effective date</label><input name="effective" required placeholder="e.g. 01 Dec 2026"></div>
        <div class="field"><label>Push to colleges</label>
          <div class="check-grid">
            ${COLLEGES.map((c)=>`<label class="check-row"><input type="checkbox" name="col" value="${c}" checked> ${c}</label>`).join('')}
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Push policy</button>
        </div>
      </form>
    </div>
  </div>`;
}
function submitPolicy(e){
  e.preventDefault();
  const f = e.target;
  const cols = Array.from(f.querySelectorAll('input[name="col"]:checked')).map(c=>c.value);
  if(!cols.length){ toast('Select at least one college.'); return; }
  state.policies.unshift({
    title:f.title.value, summary:f.summary.value, effective:f.effective.value,
    colleges: cols.map(c=>({college:c, ack:false})), status:'Distributing'
  });
  closeModal();
  if(state.active==='policies') renderContent();
  toast('Policy pushed to ' + cols.length + ' tenant dashboard(s).');
}
function openPolicyDetail(i){
  const p = state.policies[i];
  const ackCount = p.colleges.filter(c=>c.ack).length;
  $('#drawer-root').innerHTML = `<div class="drawer-overlay" onclick="if(event.target===this)closeDrawer()">
    <div class="drawer">
      <div class="drawer-top"><div><div class="eyebrow">Policy · Effective ${p.effective}</div><h3>${p.title}</h3></div><button class="close-x" onclick="closeDrawer()">&times;</button></div>
      <div class="kv"><span class="k">Summary</span><span class="v">${p.summary}</span></div>
      <div class="kv"><span class="k">Acknowledged</span><span class="v">${ackCount} / ${p.colleges.length}</span></div>
      <div class="section-head" style="margin-top:24px;"><h2 style="font-size:15px;">By college</h2></div>
      <ul class="mini-list">
        ${p.colleges.map((c,ci)=>`<li>
          <span>${c.college}</span>
          <span style="display:flex;align-items:center;gap:8px;">
            ${c.ack?'<span class="tag">Acknowledged</span>':'<span class="tag dim">Pending</span>'}
            <button class="btn btn-outline btn-small" onclick="togglePolicyAck(${i},${ci})">${c.ack?'Reset':'Mark ack.'}</button>
          </span>
        </li>`).join('')}
      </ul>
      <div class="drawer-actions">
        <button class="btn btn-outline" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>`;
}
function togglePolicyAck(pi, ci){
  const p = state.policies[pi];
  p.colleges[ci].ack = !p.colleges[ci].ack;
  p.status = p.colleges.every(c=>c.ack) ? 'Fully acknowledged' : 'Distributing';
  openPolicyDetail(pi);
  if(state.active==='policies') renderContent();
}

/* ============================= SPECIAL VIEW: WHISTLEBLOWER CHANNEL ============================= */
function nextWbId(){
  const n = state.whistleblower.length + 1;
  return 'WB-2026-' + String(300+n).padStart(4,'0');
}
function renderWhistleblower(){
  const open = state.whistleblower.filter(r=>r.status!=='Resolved').length;
  return `
    <p class="lede">This channel does not collect or store the identity of the person submitting a report. Reports are logged with an anonymous case ID only, visible to QCAD investigators.</p>
    <div class="kpi-row">
      <div class="kpi"><div class="num">${state.whistleblower.length}</div><div class="label">Total reports on file</div></div>
      <div class="kpi"><div class="num">${open}</div><div class="label">Open cases</div></div>
      <div class="kpi"><div class="num">${state.whistleblower.filter(r=>r.status==='Resolved').length}</div><div class="label">Resolved</div></div>
      <div class="kpi"><div class="num">${new Set(state.whistleblower.map(r=>r.college)).size}</div><div class="label">Colleges represented</div></div>
    </div>
    <div class="section-head"><h2>Submit an anonymous report</h2></div>
    <div class="table-wrap" style="border:none;">
      <form onsubmit="submitWhistleblower(event)" style="max-width:560px;">
        <div class="two-col">
          <div class="field"><label>College (optional)</label><select name="college"><option>Prefer not to say</option>${COLLEGES.map(c=>`<option>${c}</option>`).join('')}</select></div>
          <div class="field"><label>Category</label><select name="category">${['Academic Integrity','Harassment','Financial Misconduct','Safety','Other'].map(c=>`<option>${c}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label>Description</label><textarea name="description" required placeholder="Describe what you observed. Do not include your name."></textarea></div>
        <button type="submit" class="btn btn-full">Submit anonymous report</button>
      </form>
    </div>
    <div class="section-head"><h2>Reports on file</h2><span class="hint">${state.whistleblower.length} cases · click a row for detail</span></div>
    ${state.whistleblower.length ? `<div class="table-wrap"><table class="ledger"><thead><tr>
      <th>Case ID</th><th>College</th><th>Category</th><th>Date</th><th>Status</th>
    </tr></thead><tbody>
      ${state.whistleblower.map((r,i)=>`<tr onclick="openWbDetail(${i})">
        <td>${r.id}</td><td>${r.college}</td><td>${r.category}</td><td>${r.date}</td>
        <td>${r.status==='Resolved'?'<span class="tag dim">Resolved</span>':'<span class="tag">'+r.status+'</span>'}</td>
      </tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">No reports on file.</div>`}
  `;
}
function submitWhistleblower(e){
  e.preventDefault();
  const f = e.target;
  state.whistleblower.unshift({
    id:nextWbId(), college:f.college.value, category:f.category.value, date:'Sep 2026', status:'Received', description:f.description.value
  });
  f.reset();
  renderContent();
  toast('Report submitted anonymously. Case ID assigned.');
}
function openWbDetail(i){
  const r = state.whistleblower[i];
  const order = ['Received','Under investigation','Resolved'];
  const next = order[order.indexOf(r.status)+1];
  $('#drawer-root').innerHTML = `<div class="drawer-overlay" onclick="if(event.target===this)closeDrawer()">
    <div class="drawer">
      <div class="drawer-top"><div><div class="eyebrow">${r.category} · ${r.college}</div><h3>${r.id}</h3></div><button class="close-x" onclick="closeDrawer()">&times;</button></div>
      <div class="kv"><span class="k">Date received</span><span class="v">${r.date}</span></div>
      <div class="kv"><span class="k">Status</span><span class="v">${r.status}</span></div>
      <div class="kv"><span class="k">Description</span><span class="v">${r.description}</span></div>
      <div class="notice">Reporter identity is not collected or stored by this channel. Investigators can only see the case details shown here.</div>
      <div class="drawer-actions">
        ${next ? `<button class="btn" onclick="advanceWb(${i})">Advance to “${next}”</button>` : ''}
        <button class="btn btn-outline" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>`;
}
function advanceWb(i){
  const order = ['Received','Under investigation','Resolved'];
  const r = state.whistleblower[i];
  const next = order[order.indexOf(r.status)+1];
  if(next) r.status = next;
  closeDrawer();
  renderContent();
  toast('Case status advanced.');
}

/* ============================= GENERIC RENDER ENGINE ============================= */
function renderGenericFeature(id){
  const cfg = FEATURES[id];
  const rows = state[cfg.dataKey];
  const kpis = cfg.kpis(rows);
  const chart = cfg.chart ? cfg.chart(rows) : null;
  return `
    <div class="kpi-row">${kpis.map(k=>`<div class="kpi"><div class="num">${k.value}</div><div class="label">${k.label}</div>${k.delta?`<div class="delta">${k.delta}</div>`:''}</div>`).join('')}</div>
    ${chart ? `
      <div class="section-head"><h2>Trend</h2><span class="hint">Illustrative view across current entries</span></div>
      <div class="chart-wrap">${barChart(id+'-chart', chart.labels, chart.series)}</div>
      ${chart.series.length>1 ? chartLegend(chart.series) : ''}
    ` : ''}
    <div class="section-head"><h2>${cfg.tableTitle}</h2><span class="hint">${rows.length} ${rows.length===1?'record':'records'} · click a row for detail</span></div>
    ${renderTable(cfg, rows)}
  `;
}
function renderTable(cfg, rows){
  if(!rows.length) return `<div class="empty">No records yet. Use the action button above to add one.</div>`;
  const featureKey = Object.keys(FEATURES).find(k=>FEATURES[k]===cfg);
  return `<div class="table-wrap"><table class="ledger"><thead><tr>
    ${cfg.columns.map(c=>`<th class="${c.align==='num'?'num':''}">${c.label}</th>`).join('')}
  </tr></thead><tbody>
    ${rows.map((r,i)=>`<tr onclick="openDetail('${featureKey}',${i})">
      ${cfg.columns.map(c=>`<td class="${c.align==='num'?'num':''}">${c.fmt ? c.fmt(r[c.key], r) : r[c.key]}</td>`).join('')}
    </tr>`).join('')}
  </tbody></table></div>`;
}
function openDetail(featureId, idx){
  const cfg = FEATURES[featureId];
  const row = state[cfg.dataKey][idx];
  const titleKey = cfg.columns[0].key;
  $('#drawer-root').innerHTML = `<div class="drawer-overlay" onclick="if(event.target===this)closeDrawer()">
    <div class="drawer">
      <div class="drawer-top"><div><div class="eyebrow">${TITLES[featureId].title}</div><h3>${row[titleKey]}</h3></div><button class="close-x" onclick="closeDrawer()">&times;</button></div>
      ${cfg.columns.slice(1).map(c=>`<div class="kv"><span class="k">${c.label}</span><span class="v">${c.fmt ? c.fmt(row[c.key], row) : row[c.key]}</span></div>`).join('')}
      <div class="drawer-actions">
        ${cfg.rowAction ? `<button class="btn" onclick="applyRowAction('${featureId}',${idx})">${cfg.rowAction.label}</button>` : ''}
        <button class="btn btn-outline" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>`;
}
function applyRowAction(featureId, idx){
  const cfg = FEATURES[featureId];
  const row = state[cfg.dataKey][idx];
  cfg.rowAction.apply(row, idx);
  closeDrawer();
  renderContent();
}
function openAddModal(featureId){
  const cfg = FEATURES[featureId];
  const form = cfg.form;
  $('#modal-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>${form.title}</h3>
      <div class="sub">${form.sub}</div>
      <form onsubmit="submitAdd(event,'${featureId}')">
        ${form.fields.map(f=>{
          if(f.type==='select'){
            return `<div class="field"><label>${f.label}</label><select name="${f.key}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
          }
          return `<div class="field"><label>${f.label}</label><input name="${f.key}" type="${f.type}" ${f.step?`step="${f.step}"`:''} placeholder="${f.placeholder||''}"></div>`;
        }).join('')}
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">${form.actionLabel.replace('+ ','').replace(/^./,c=>c.toUpperCase())}</button>
        </div>
      </form>
    </div>
  </div>`;
}
function submitAdd(e, featureId){
  e.preventDefault();
  const cfg = FEATURES[featureId];
  const f = e.target;
  const values = {};
  cfg.form.fields.forEach(fl => { values[fl.key] = f[fl.key] ? f[fl.key].value : ''; });
  const row = cfg.form.build(values);
  state[cfg.dataKey].unshift(row);
  closeModal();
  if(state.active===featureId) renderContent();
  toast('Added successfully.');
}

/* ============================= TOP-LEVEL RENDER ============================= */
function renderSidebar(){
  $('#sidebar').innerHTML = `
    <div class="brand">
      <div class="brand-mark">ING Group Oversight</div>
      <div class="brand-sub">QCAD Console — Cross-Tenant Quality Assurance</div>
    </div>
    <nav class="nav">
      ${NAV.map(n=>`<button class="nav-item" data-id="${n.id}" onclick="navigate('${n.id}')"><span class="nav-mono">${n.mono}</span>${n.label}</button>`).join('')}
    </nav>
    <div class="sidebar-foot">
      <div class="who">Signed in as QCAD</div>
      Group Quality Assurance · All 6 colleges
    </div>
  `;
}
function renderTopbar(){
  const t = TITLES[state.active];
  let actionsHtml = '';
  if(FEATURES[state.active] && FEATURES[state.active].form){
    actionsHtml = `<button class="btn" onclick="openAddModal('${state.active}')">${FEATURES[state.active].form.actionLabel}</button>`;
  } else if(state.active==='policies'){
    actionsHtml = `<button class="btn" onclick="openPolicyModal()">+ Push new policy</button>`;
  }
  $('#topbar').innerHTML = `
    <div>
      <div class="title-row"><button class="menu-btn" onclick="toggleSidebar()">&#9776;</button><h1>${t.title}</h1></div>
      <div class="desc">${t.desc}</div>
    </div>
    <div class="actions">${actionsHtml}</div>
  `;
}
function renderContent(){
  let html = '';
  if(state.active==='dashboard') html = renderDashboard();
  else if(state.active==='policies') html = renderPolicies();
  else if(state.active==='whistleblower') html = renderWhistleblower();
  else if(FEATURES[state.active]) html = renderGenericFeature(state.active);
  $('#content').innerHTML = html;
}
function navigate(id){
  state.active = id;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-id')===id);
  });
  renderTopbar();
  renderContent();
  closeModal(); closeDrawer();
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

/* ============================= INIT ============================= */
renderSidebar();
navigate('dashboard');
</script>
</body>
</html>
