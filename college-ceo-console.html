<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College CEO Console — Northgate College</title>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #111111;
        --ink-soft: #5b5b5b;
        --ink-faint: #9a9a9a;
        --line: #dcdcdc;
        --line-strong: #b7b7b7;
        --fill: #f4f4f4;
        --sidebar: #070707;
        --sidebar-line: #242424;
        --sidebar-ink: #cfcfcf;
        --sidebar-ink-dim: #7a7a7a;
        --serif:
          "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--sans);
        color: var(--ink);
        background: var(--bg);
        font-size: 14.5px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font-family: inherit;
      }
      .app {
        display: flex;
        min-height: 100vh;
      }

      /* SIDEBAR */
      .sidebar {
        width: 264px;
        flex-shrink: 0;
        background: var(--sidebar);
        color: var(--sidebar-ink);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
      .brand {
        padding: 26px 24px 18px;
        border-bottom: 1px solid var(--sidebar-line);
      }
      .brand-mark {
        font-family: var(--serif);
        font-size: 19px;
        color: #fff;
        letter-spacing: 0.01em;
      }
      .brand-sub {
        font-size: 11px;
        color: var(--sidebar-ink-dim);
        margin-top: 5px;
      }
      .nav {
        flex: 1;
        padding: 12px 10px;
        overflow-y: auto;
      }
      .nav-group-label {
        font-size: 10.5px;
        color: var(--sidebar-ink-dim);
        padding: 14px 14px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 9px 12px;
        background: none;
        border: none;
        color: var(--sidebar-ink);
        font-size: 13px;
        text-align: left;
        cursor: pointer;
        border-left: 2px solid transparent;
        font-family: var(--sans);
      }
      .nav-item:hover {
        color: #fff;
      }
      .nav-item.active {
        color: #fff;
        border-left-color: #fff;
        background: rgba(255, 255, 255, 0.06);
      }
      .nav-mono {
        width: 30px;
        height: 20px;
        border: 1px solid var(--sidebar-line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9.5px;
        letter-spacing: 0.02em;
        color: var(--sidebar-ink-dim);
        flex-shrink: 0;
      }
      .nav-item.active .nav-mono {
        border-color: #fff;
        color: #fff;
      }
      .sidebar-foot {
        padding: 16px 24px;
        border-top: 1px solid var(--sidebar-line);
        font-size: 11.5px;
        color: var(--sidebar-ink-dim);
      }
      .sidebar-foot .who {
        color: #e6e6e6;
        font-size: 12.5px;
        margin-bottom: 2px;
      }

      /* MAIN */
      .main {
        flex: 1;
        min-width: 0;
      }
      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        padding: 28px 40px 20px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .topbar h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 26px;
        margin: 0;
      }
      .topbar .desc {
        font-size: 13px;
        color: var(--ink-soft);
        margin-top: 6px;
        max-width: 640px;
      }
      .topbar .actions {
        display: flex;
        gap: 10px;
        flex-shrink: 0;
        padding-top: 2px;
      }
      .content {
        padding: 32px 40px 90px;
        max-width: 1180px;
      }

      /* BUTTONS */
      .btn {
        font-family: var(--sans);
        font-size: 13px;
        padding: 9px 16px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: #fff;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover {
        background: #000;
      }
      .btn-outline {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line-strong);
      }
      .btn-outline:hover {
        border-color: var(--ink);
      }
      .btn-ghost {
        background: none;
        border: none;
        color: var(--ink-soft);
        text-decoration: underline;
        cursor: pointer;
        font-size: 12.5px;
        padding: 0;
      }
      .btn-small {
        padding: 5px 11px;
        font-size: 12px;
      }

      /* KPI ROW */
      .kpi-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        margin-bottom: 38px;
      }
      .kpi {
        padding: 20px 22px;
        border-left: 1px solid var(--line);
      }
      .kpi:first-child {
        border-left: none;
      }
      .kpi .num {
        font-family: var(--serif);
        font-size: 29px;
        font-variant-numeric: tabular-nums;
      }
      .kpi .label {
        font-size: 11.8px;
        color: var(--ink-soft);
        margin-top: 5px;
      }
      .kpi .delta {
        font-size: 11.3px;
        margin-top: 7px;
        color: var(--ink-faint);
      }

      /* SECTIONS */
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 44px 0 14px;
        flex-wrap: wrap;
        gap: 6px;
      }
      .section-head h2 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 18px;
        margin: 0;
      }
      .section-head .hint {
        font-size: 11.8px;
        color: var(--ink-faint);
      }
      .lede {
        font-size: 13px;
        color: var(--ink-soft);
        margin: -8px 0 30px;
        max-width: 680px;
      }

      /* CHART */
      .chart-wrap {
        border: 1px solid var(--line);
        padding: 22px 24px 16px;
      }
      .legend {
        display: flex;
        gap: 20px;
        font-size: 12px;
        color: var(--ink-soft);
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .swatch {
        width: 10px;
        height: 10px;
        display: inline-block;
        border: 1px solid var(--ink);
      }

      /* TABLE */
      .table-wrap {
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
      }
      table.ledger {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        min-width: 560px;
      }
      table.ledger th {
        text-align: left;
        font-weight: 500;
        color: var(--ink-soft);
        font-size: 11.3px;
        padding: 0 14px 10px;
        border-bottom: 1px solid var(--ink);
        white-space: nowrap;
      }
      table.ledger td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      table.ledger tbody tr {
        cursor: pointer;
      }
      table.ledger tbody tr:hover {
        background: var(--fill);
      }
      table.ledger td.num,
      table.ledger th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .tag {
        display: inline-block;
        font-size: 10.8px;
        padding: 2.5px 8px;
        border: 1px solid var(--ink);
        white-space: nowrap;
      }
      .tag.dim {
        border-color: var(--line-strong);
        color: var(--ink-soft);
      }
      .row-actions {
        display: flex;
        gap: 6px;
      }
      .row-actions button {
        position: relative;
        z-index: 2;
      }

      /* DASHBOARD GRID */
      .dash-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--line);
        margin: 8px 0 40px;
      }
      .dash-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
      }
      .dash-card {
        background: #fff;
        padding: 22px;
        cursor: pointer;
        transition: background 0.1s;
      }
      .dash-card:hover {
        background: var(--fill);
      }
      .dash-card .mono {
        width: 34px;
        height: 24px;
        border: 1px solid var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        margin-bottom: 16px;
      }
      .dash-card h4 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 16px;
        margin: 0 0 8px;
      }
      .dash-card p {
        font-size: 12.3px;
        color: var(--ink-soft);
        margin: 0 0 14px;
        min-height: 34px;
      }
      .dash-card .metric {
        font-family: var(--serif);
        font-size: 21px;
      }
      .dash-card .metric-label {
        font-size: 11px;
        color: var(--ink-faint);
      }

      /* OVERLAYS: MODAL + DRAWER */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.32);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 80;
        padding: 20px;
      }
      .modal {
        background: #fff;
        width: 480px;
        max-width: 100%;
        max-height: 92vh;
        overflow-y: auto;
        padding: 30px 32px;
        border: 1px solid var(--ink);
      }
      .modal h3 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 21px;
        margin: 0 0 4px;
      }
      .modal .sub {
        font-size: 12.5px;
        color: var(--ink-soft);
        margin-bottom: 22px;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 11.8px;
        color: var(--ink-soft);
        margin-bottom: 6px;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--line-strong);
        font-family: var(--sans);
        font-size: 13.5px;
        background: #fff;
        color: var(--ink);
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: 2px solid var(--ink);
        outline-offset: 1px;
      }
      .field textarea {
        min-height: 78px;
        resize: vertical;
      }
      .check-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 14px;
      }
      .check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
      }

      .drawer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.25);
        z-index: 70;
        display: flex;
        justify-content: flex-end;
      }
      .drawer {
        width: 440px;
        max-width: 94vw;
        background: #fff;
        height: 100%;
        overflow-y: auto;
        padding: 32px 34px;
        border-left: 1px solid var(--ink);
      }
      .drawer .eyebrow {
        font-size: 11.5px;
        color: var(--ink-faint);
        margin-bottom: 6px;
      }
      .drawer h3 {
        font-family: var(--serif);
        font-size: 22px;
        font-weight: 400;
        margin: 0 0 18px;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .kv .k {
        color: var(--ink-soft);
        flex-shrink: 0;
      }
      .kv .v {
        text-align: right;
      }
      .drawer-actions {
        display: flex;
        gap: 10px;
        margin-top: 26px;
        flex-wrap: wrap;
      }
      .drawer-note {
        margin-top: 20px;
      }
      .close-x {
        background: none;
        border: none;
        font-size: 20px;
        color: var(--ink-soft);
        cursor: pointer;
        line-height: 1;
        padding: 0;
      }
      .drawer-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      /* TOAST */
      .toast {
        position: fixed;
        bottom: 26px;
        right: 26px;
        background: #111;
        color: #fff;
        padding: 13px 20px;
        font-size: 13px;
        z-index: 100;
        border: 1px solid #000;
      }

      /* MISC */
      .footnote {
        font-size: 11.5px;
        color: var(--ink-faint);
        margin-top: 10px;
      }
      .pill-count {
        display: inline-block;
        font-size: 11px;
        border: 1px solid var(--ink);
        padding: 2px 9px;
        margin-left: 10px;
      }
      .empty {
        padding: 40px 0;
        text-align: center;
        color: var(--ink-faint);
        font-size: 13px;
        border: 1px dashed var(--line-strong);
      }
      .slide-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .slide-list li {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .slide-list li .num {
        color: var(--ink-faint);
        font-size: 11.5px;
        margin-right: 8px;
      }

      @media (max-width: 820px) {
        .sidebar {
          position: fixed;
          z-index: 60;
          transform: translateX(-100%);
          transition: transform 0.2s;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .topbar,
        .content {
          padding-left: 20px;
          padding-right: 20px;
        }
        .menu-btn {
          display: inline-flex !important;
        }
      }
      .menu-btn {
        display: none;
        border: 1px solid var(--line-strong);
        background: #fff;
        padding: 8px 10px;
        cursor: pointer;
        margin-right: 12px;
      }
      .title-row {
        display: flex;
        align-items: center;
      }
    </style>
  </head>

    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main">
        <div class="topbar" id="topbar"></div>

      </main>
    </div>

    <div id="drawer-root"></div>

      /* ============================= UTILITIES ============================= */
      const $ = (sel) => document.querySelector(sel);

        n >= 1000000 ? "$" + (n / 1000000).toFixed(2) + "M" : money(n);
      const pct = (n) => Math.round(n * 10) / 10 + "%";
      const num = (n) => Math.round(n).toLocaleString("en-US");
      function toast(msg) {
        const root = $("#toast-root");
        root.innerHTML = `<div class="toast">${msg}</div>`;
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => {
          root.innerHTML = "";
        }, 2600);
      }
      function closeModal() {
        $("#modal-root").innerHTML = "";
      }
      function closeDrawer() {
        $("#drawer-root").innerHTML = "";
      }

      /* ============================= CHART (SVG bar) ============================= */
      function barChart(id, labels, series) {
        const w = Math.max(
          600,
          labels.length * Math.max(90, series.length * 46),
        );
        const h = 210,
          padL = 8,
          padB = 28,
          padT = 16,
          padR = 8;
        const max = Math.max(1, ...series.flatMap((s) => s.values)) * 1.18;
        const groupW = (w - padL - padR) / labels.length;
        const barW = Math.min(30, (groupW - 18) / series.length);
        let bars = "";
        labels.forEach((lab, li) => {
          const gx =
            padL +
            li * groupW +
            (groupW - (barW * series.length + (series.length - 1) * 6)) / 2;
          series.forEach((s, si) => {
            const val = s.values[li];
            const bh = (val / max) * (h - padT - padB);
            const bx = gx + si * (barW + 6);
            const by = h - padB - bh;
            const fillId =
              si === 0
                ? `url(#${id}-f0)`
                : si === 1
                  ? `url(#${id}-f1)`
                  : `url(#${id}-f2)`;
            bars += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(bh, 0).toFixed(1)}" fill="${fillId}" stroke="#111" stroke-width="0.6"/>`;
            bars += `<text x="${(bx + barW / 2).toFixed(1)}" y="${(by - 5).toFixed(1)}" font-size="9.5" text-anchor="middle" fill="#5b5b5b" font-family="sans-serif">${s.fmt ? s.fmt(val) : val}</text>`;
          });
          bars += `<text x="${(gx + (barW * series.length + (series.length - 1) * 6) / 2).toFixed(1)}" y="${h - 9}" font-size="10.3" text-anchor="middle" fill="#5b5b5b" font-family="sans-serif">${lab}</text>`;
        });
        bars += `<line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="#111" stroke-width="1"/>`;
        return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
    <defs>
      <pattern id="${id}-f1" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="2.6"/></pattern>
      <pattern id="${id}-f0" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#111"/></pattern>
      <pattern id="${id}-f2" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#c7c7c7"/></pattern>
    </defs>
    ${bars}
  </svg>`;
      }
      function chartLegend(series) {
        return `<div class="legend">${series.map((s, i) => `<span><span class="swatch" style="background:${i === 0 ? "#111" : i === 1 ? "repeating-linear-gradient(45deg,#111,#111 2px,#fff 2px,#fff 4px)" : "#c7c7c7"}"></span>${s.name}</span>`).join("")}</div>`;
      }

      function openBriefModal() {

          `<div class="overlay" onclick="if(event.target===this)closeModal()">

        <div class="field"><label>Period label</label><input name="period" required placeholder="e.g. September 2026 Monthly"></div>
        <div class="field"><label>Sections to include</label>
          <div class="check-grid">
            ${BRIEF_SECTIONS.map((s, i) => `<label class="check-row"><input type="checkbox" name="sec" value="${s}" ${i < 3 ? "checked" : ""}> ${s}</label>`).join("")}
          </div>

          <select name="format"><option>PDF</option><option>DOCX</option></select>

        </div>

  </div>`;
      }
      function submitBrief(e) {
        e.preventDefault();
        const f = e.target;
        const period = f.period.value;
        const sections = Array.from(
          f.querySelectorAll('input[name="sec"]:checked'),
        ).map((c) => c.value);
        const format = f.format.value;
        if (!sections.length) {
          toast("Select at least one section.");
          return;
        }
        const brief = {
          period,
          sections,
          format,
          status: "Generating…",
          generated: "—",
        };
        state.briefs.unshift(brief);
        closeModal();
        if (state.active === "brief") renderContent();
        toast("Compiling briefing…");
        setTimeout(() => {
          brief.status = "Ready";
          brief.generated = "Sep 2026";
          if (state.active === "brief") renderContent();
          toast("Briefing ready to download.");
        }, 1500);
      }
      function openBriefDetail(i) {
        const b = state.briefs[i];
        $("#drawer-root").innerHTML =
          `<div class="drawer-overlay" onclick="if(event.target===this)closeDrawer()">

      <div class="drawer-top"><div><div class="eyebrow">Executive briefing</div><h3>${b.period}</h3></div><button class="close-x" onclick="closeDrawer()">&times;</button></div>

      <div class="section-head" style="margin-top:26px;"><h2 style="font-size:15px;">Outline</h2></div>

        ${b.sections.map((s, idx) => `<li><span class="num">${String(idx + 1).padStart(2, "0")}</span>${s}</li>`).join("")}
      </ul>
      <div class="drawer-actions">
        ${b.status === "Ready" ? `<button class="btn" onclick="toast('Download started: ${b.period.replace(/\\s+/g, "_")}.${b.format.toLowerCase()}')">Download ${b.format}</button>` : `<button class="btn" disabled style="opacity:.5;cursor:default;">Compiling…</button>`}
        <button class="btn btn-outline" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>`;
      }

        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Draft panel</button>
        </div>
      </form>
    </div>
  </div>`;
      }
      function submitDeck(e) {
        e.preventDefault();
        const f = e.target;
        const modules = Array.from(
          f.querySelectorAll('input[name="mod"]:checked'),
        ).map((c) => c.value);
        if (!modules.length) {
          toast("Select at least one module.");
          return;
        }
        state.decks.unshift({
          title: f.title.value,
          date: f.date.value,
          modules,
          status: "Draft",
        });
        closeModal();
        if (state.active === "decks") renderContent();
        toast("Panel drafted.");
      }
      function deckSlideSnapshot(mod) {
        const cfg = FEATURES[mod];
        if (!cfg) return TITLES[mod].title;
        const kpi = cfg.kpis(state[cfg.dataKey])[0];
        return `${TITLES[mod].title} — ${kpi.value} ${kpi.label.toLowerCase()}`;
      }
      function openDeckDetail(i) {
        const d = state.decks[i];
        $("#drawer-root").innerHTML =
          `<div class="drawer-overlay" onclick="if(event.target===this)closeDrawer()">
    <div class="drawer">
      <div class="drawer-top"><div><div class="eyebrow">Board panel</div><h3>${d.title}</h3></div><button class="close-x" onclick="closeDrawer()">&times;</button></div>
      <div class="kv"><span class="k">Meeting date</span><span class="v">${d.date}</span></div>
      <div class="kv"><span class="k">Status</span><span class="v">${d.status}</span></div>
      <div class="section-head" style="margin-top:26px;"><h2 style="font-size:15px;">Generated slides</h2></div>
      <ul class="slide-list">
        ${d.modules.map((m, idx) => `<li><span class="num">${String(idx + 1).padStart(2, "0")}</span>${deckSlideSnapshot(m)}</li>`).join("")}
      </ul>
      <div class="drawer-actions">
        <button class="btn" onclick="toast('Panel exported to PDF.')">Export to PDF</button>
        ${d.status !== "Final" ? `<button class="btn btn-outline" onclick="markDeckFinal(${i})">Mark final</button>` : ""}
        <button class="btn btn-outline" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>`;
      }
      function markDeckFinal(i) {
        state.decks[i].status = "Final";
        closeDrawer();
        if (state.active === "decks") renderContent();
        toast("Panel marked final.");
      }

      /* ============================= SPECIAL VIEW: RISK REGISTER (extends generic) ============================= */
      FEATURES.risks = {
        dataKey: "risks",
        tableTitle: "Risk register",
        kpis: (rows) => [
          {
            value: rows.filter((r) => r.status !== "Mitigated").length,
            label: "Active risks",
          },
          {
            value: rows.filter((r) => r.severity === "High").length,
            label: "High severity",
          },
          { value: "2", label: "New this month" },
          {
            value: rows.filter((r) => r.status === "Mitigated").length,
            label: "Mitigated",
          },
        ],
        chart: (rows) => ({
          labels: ["High", "Medium", "Low"],
          series: [
            {
              name: "Risk count",
              values: ["High", "Medium", "Low"].map(
                (sv) => rows.filter((r) => r.severity === sv).length,
              ),
            },
          ],
        }),
        columns: [
          { key: "title", label: "Risk" },
          { key: "category", label: "Category" },
          {
            key: "severity",
            label: "Severity",
            fmt: (v) =>
              `<span class="tag ${v === "High" ? "" : "dim"}">${v}</span>`,
          },
          { key: "trend", label: "Trend" },
          { key: "owner", label: "Owner" },
          {
            key: "status",
            label: "Status",
            fmt: (v) =>
              `<span class="tag ${v === "Mitigated" ? "dim" : ""}">${v}</span>`,
          },
        ],
        form: {
          actionLabel: "+ Log new risk",
          title: "Log new risk",
          sub: "Add a new item to the strategic risk register.",
          fields: [
            {
              key: "title",
              label: "Risk title",
              type: "text",
              placeholder: "e.g. Vendor contract lapse — IT services",
            },
            {
              key: "category",
              label: "Category",
              type: "select",
              options: [
                "Staffing",
                "Financial",
                "Enrollment",
                "Facilities",
                "Compliance",
              ],
            },
            {
              key: "severity",
              label: "Severity",
              type: "select",
              options: ["High", "Medium", "Low"],
            },
            {
              key: "owner",
              label: "Owner",
              type: "text",
              placeholder: "e.g. Finance Office",
            },
          ],
          build: (v) => ({
            title: v.title || "Untitled risk",
            category: v.category || "Staffing",
            severity: v.severity || "Medium",
            trend: "Stable",
            owner: v.owner || "Unassigned",
            status: "Open",
          }),
        },
        rowAction: {
          label: "Mark mitigated",
          apply: (row) => {
            row.status = "Mitigated";
            row.trend = "Falling";
            toast("Risk marked mitigated.");
          },
        },
      };

      /* ============================= SPECIAL VIEW: COMMAND OVERRIDES ============================= */
      function renderOverrides() {
        const pending = state.overrides.filter(
          (o) => o.status === "Pending",
        ).length;
        return `
    <div class="kpi-row">
      <div class="kpi"><div class="num">${pending}</div><div class="label">Pending your approval</div></div>
      <div class="kpi"><div class="num">${state.overrides.filter((o) => o.status === "Approved").length}</div><div class="label">Approved this cycle</div></div>
      <div class="kpi"><div class="num">${state.overrides.filter((o) => o.status === "Rejected").length}</div><div class="label">Rejected this cycle</div></div>
      <div class="kpi"><div class="num">${state.overrides.length}</div><div class="label">Total requests on file</div></div>
    </div>
    <div class="section-head"><h2>Approval queue</h2><span class="hint">Click a row for full detail</span></div>
    <div class="table-wrap"><table class="ledger"><thead><tr>
      <th>Type</th><th>Requested by</th><th>Amount</th><th>Reason</th><th>Status</th><th></th>
    </tr></thead><tbody>
      ${state.overrides
        .map(
          (o, i) => `<tr onclick="openOverrideDetail(${i})">
        <td>${o.type}</td>
        <td>${o.requestor}</td>
        <td class="num">${o.amount}</td>
        <td>${o.reason}</td>
        <td>${overrideTag(o.status)}</td>
        <td class="row-actions">
          ${
            o.status === "Pending"
              ? `
            <button class="btn btn-small" onclick="event.stopPropagation();quickDecision(${i},'Approved')">Approve</button>
            <button class="btn btn-outline btn-small" onclick="event.stopPropagation();openOverrideDetail(${i},true)">Reject</button>
          `
              : ""
          }
        </td>
      </tr>`,
        )
        .join("")}
    </tbody></table></div>
  `;
      }
      function overrideTag(s) {
        if (s === "Pending") return '<span class="tag dim">Pending</span>';
        if (s === "Approved") return '<span class="tag">Approved</span>';
        return '<span class="tag dim">Rejected</span>';
      }
      function quickDecision(i, decision) {
        state.overrides[i].status = decision;
        renderContent();
        toast(`Request ${decision.toLowerCase()}.`);
      }
      function openOverrideDetail(i, focusReject) {
        const o = state.overrides[i];
        $("#drawer-root").innerHTML =
          `<div class="drawer-overlay" onclick="if(event.target===this)closeDrawer()">
    <div class="drawer">
      <div class="drawer-top"><div><div class="eyebrow">${o.type}</div><h3>${o.reason}</h3></div><button class="close-x" onclick="closeDrawer()">&times;</button></div>
      <div class="kv"><span class="k">Requested by</span><span class="v">${o.requestor}</span></div>
      <div class="kv"><span class="k">Amount</span><span class="v">${o.amount}</span></div>
      <div class="kv"><span class="k">Status</span><span class="v">${o.status}</span></div>
      ${o.status !== "Pending" && o.note ? `<div class="kv"><span class="k">Decision note</span><span class="v">${o.note}</span></div>` : ""}
      ${
        o.status === "Pending"
          ? `
        <div class="drawer-note">
          <div class="field"><label>Decision note ${focusReject ? "(required to reject)" : "(optional for approval)"}</label>
            <textarea id="override-note" placeholder="Add context for this decision"></textarea>
          </div>
        </div>
        <div class="drawer-actions">
          <button class="btn" onclick="decideOverride(${i},'Approved')">Approve request</button>
          <button class="btn btn-outline" onclick="decideOverride(${i},'Rejected')">Reject request</button>
        </div>
      `
          : `<div class="drawer-actions"><button class="btn btn-outline" onclick="closeDrawer()">Close</button></div>`
      }
    </div>
  </div>`;
        if (focusReject) {
          setTimeout(() => {
            const t = $("#override-note");
            if (t) t.focus();
          }, 50);
        }
      }
      function decideOverride(i, decision) {
        const note = ($("#override-note") || {}).value || "";
        if (decision === "Rejected" && !note.trim()) {
          toast("Add a reason before rejecting.");
          return;
        }
        state.overrides[i].status = decision;
        state.overrides[i].note = note;
        closeDrawer();
        renderContent();
        toast(`Request ${decision.toLowerCase()}.`);
      }

      /* ============================= GENERIC RENDER ENGINE ============================= */
      function renderGenericFeature(id) {
        const cfg = FEATURES[id];
        const rows = state[cfg.dataKey];
        const kpis = cfg.kpis(rows);
        const chart = cfg.chart ? cfg.chart(rows) : null;
        return `
    <div class="kpi-row">${kpis.map((k) => `<div class="kpi"><div class="num">${k.value}</div><div class="label">${k.label}</div>${k.delta ? `<div class="delta">${k.delta}</div>` : ""}</div>`).join("")}</div>
    ${
      chart
        ? `
      <div class="section-head"><h2>Trend</h2><span class="hint">Illustrative view across current entries</span></div>
      <div class="chart-wrap">${barChart(id + "-chart", chart.labels, chart.series)}</div>
      ${chart.series.length > 1 ? chartLegend(chart.series) : ""}
    `
        : ""
    }
    <div class="section-head"><h2>${cfg.tableTitle}</h2><span class="hint">${rows.length} ${rows.length === 1 ? "record" : "records"} · click a row for detail</span></div>
    ${renderTable(cfg, rows)}
  `;
      }
      function renderTable(cfg, rows) {
        if (!rows.length)
          return `<div class="empty">No records yet. Use the action button above to add one.</div>`;
        const featureKey = Object.keys(FEATURES).find(
          (k) => FEATURES[k] === cfg,
        );
        return `<div class="table-wrap"><table class="ledger"><thead><tr>
    ${cfg.columns.map((c) => `<th class="${c.align === "num" ? "num" : ""}">${c.label}</th>`).join("")}
  </tr></thead><tbody>
    ${rows
      .map(
        (r, i) => `<tr onclick="openDetail('${featureKey}',${i})">
      ${cfg.columns.map((c) => `<td class="${c.align === "num" ? "num" : ""}">${c.fmt ? c.fmt(r[c.key], r) : r[c.key]}</td>`).join("")}
    </tr>`,
      )
      .join("")}
  </tbody></table></div>`;
      }
      function openDetail(featureId, idx) {
        const cfg = FEATURES[featureId];
        const row = state[cfg.dataKey][idx];
        const titleKey = cfg.columns[0].key;
        $("#drawer-root").innerHTML =
          `<div class="drawer-overlay" onclick="if(event.target===this)closeDrawer()">
    <div class="drawer">
      <div class="drawer-top"><div><div class="eyebrow">${TITLES[featureId].title}</div><h3>${row[titleKey]}</h3></div><button class="close-x" onclick="closeDrawer()">&times;</button></div>
      ${cfg.columns
        .slice(1)
        .map(
          (c) =>
            `<div class="kv"><span class="k">${c.label}</span><span class="v">${c.fmt ? c.fmt(row[c.key], row) : row[c.key]}</span></div>`,
        )
        .join("")}
      ${row.note ? `<div class="kv"><span class="k">Note</span><span class="v">${row.note}</span></div>` : ""}
      <div class="drawer-actions">
        ${cfg.rowAction ? `<button class="btn" onclick="applyRowAction('${featureId}',${idx})">${cfg.rowAction.label}</button>` : ""}
        <button class="btn btn-outline" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>`;
      }
      function applyRowAction(featureId, idx) {
        const cfg = FEATURES[featureId];
        const row = state[cfg.dataKey][idx];
        cfg.rowAction.apply(row, idx);
        closeDrawer();
        if (state.active === featureId) renderContent();
      }
      function openAddModal(featureId) {
        const cfg = FEATURES[featureId];
        const form = cfg.form;
        $("#modal-root").innerHTML =
          `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>${form.title}</h3>
      <div class="sub">${form.sub}</div>
      <form onsubmit="submitAdd(event,'${featureId}')">
        ${form.fields
          .map((f) => {
            if (f.type === "select") {
              return `<div class="field"><label>${f.label}</label><select name="${f.key}">${f.options.map((o) => `<option>${o}</option>`).join("")}</select></div>`;
            }
            if (f.type === "textarea") {
              return `<div class="field"><label>${f.label}</label><textarea name="${f.key}" placeholder="${f.placeholder || ""}"></textarea></div>`;
            }
            return `<div class="field"><label>${f.label}</label><input name="${f.key}" type="${f.type}" ${f.step ? `step="${f.step}"` : ""} placeholder="${f.placeholder || ""}"></div>`;
          })
          .join("")}
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">${form.actionLabel.replace("+ ", "").replace(/^./, (c) => c.toUpperCase())}</button>
        </div>
      </form>
    </div>
  </div>`;
      }
      function submitAdd(e, featureId) {
        e.preventDefault();
        const cfg = FEATURES[featureId];
        const f = e.target;
        const values = {};
        cfg.form.fields.forEach((fl) => {
          values[fl.key] = f[fl.key] ? f[fl.key].value : "";
        });
        const row = cfg.form.build(values);
        state[cfg.dataKey].unshift(row);
        closeModal();
        if (state.active === featureId) renderContent();
        toast("Added successfully.");
      }

      /* ============================= TOP-LEVEL RENDER ============================= */
      function renderSidebar() {
        $("#sidebar").innerHTML = `
    <div class="brand">
      <div class="brand-mark">ING College OS</div>
      <div class="brand-sub">College CEO Console — Northgate College</div>
    </div>
    <nav class="nav">
      ${NAV.map((n) => `<button class="nav-item" data-id="${n.id}" onclick="navigate('${n.id}')"><span class="nav-mono">${n.mono}</span>${n.label}</button>`).join("")}
    </nav>
    <div class="sidebar-foot">
      <div class="who">Signed in as College CEO</div>
      Northgate College · ING Network
    </div>
  `;
      }
      function renderTopbar() {
        const t = TITLES[state.active];
        let actionsHtml = "";
        if (FEATURES[state.active] && FEATURES[state.active].form) {
          actionsHtml = `<button class="btn" onclick="openAddModal('${state.active}')">${FEATURES[state.active].form.actionLabel}</button>`;
        } else if (state.active === "brief") {
          actionsHtml = `<button class="btn" onclick="openBriefModal()">+ Generate briefing</button>`;
        } else if (state.active === "decks") {
          actionsHtml = `<button class="btn" onclick="openDeckModal()">+ Build new panel</button>`;
        } else if (state.active === "overrides") {
          const pending = state.overrides.filter(
            (o) => o.status === "Pending",
          ).length;
          actionsHtml = `<span class="pill-count">${pending} pending</span>`;
        }
        $("#topbar").innerHTML = `
    <div>
      <div class="title-row"><button class="menu-btn" onclick="toggleSidebar()">&#9776;</button><h1>${t.title}</h1></div>
      <div class="desc">${t.desc}</div>
    </div>
    <div class="actions">${actionsHtml}</div>
  `;
      }
      function renderContent() {
        let html = "";
        if (state.active === "dashboard") html = renderDashboard();
        else if (state.active === "brief") html = renderBrief();
        else if (state.active === "decks") html = renderDecks();
        else if (state.active === "overrides") html = renderOverrides();
        else if (FEATURES[state.active])
          html = renderGenericFeature(state.active);
        $("#content").innerHTML = html;
      }
      function navigate(id) {
        state.active = id;
        document.querySelectorAll(".nav-item").forEach((el) => {
          el.classList.toggle("active", el.getAttribute("data-id") === id);
        });
        renderTopbar();
        renderContent();
        closeModal();
        closeDrawer();
        document.getElementById("sidebar").classList.remove("open");
        window.scrollTo(0, 0);
      }
      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
      }

      /* ============================= INIT ============================= */
      renderSidebar();
      navigate("dashboard");
    </script>
  </body>
</html>
