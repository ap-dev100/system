<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collaborative Events Console — Northgate College</title>
<style>
:root{
  --bg:#ffffff;
  --ink:#111111;
  --ink-soft:#5b5b5b;
  --ink-faint:#9a9a9a;
  --line:#dcdcdc;
  --line-strong:#b7b7b7;
  --fill:#f4f4f4;
  --sidebar:#070707;
  --sidebar-line:#242424;
  --sidebar-ink:#cfcfcf;
  --sidebar-ink-dim:#7a7a7a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}
.app{display:flex;min-height:100vh;}

.sidebar{width:264px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:26px 24px 18px;border-bottom:1px solid var(--sidebar-line);}
.brand-mark{font-family:var(--serif);font-size:19px;color:#fff;letter-spacing:.01em;}
.brand-sub{font-size:11px;color:var(--sidebar-ink-dim);margin-top:5px;}
.nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;background:none;border:none;color:var(--sidebar-ink);font-size:13px;text-align:left;cursor:pointer;border-left:2px solid transparent;font-family:var(--sans);}
.nav-item:hover{color:#fff;}
.nav-item.active{color:#fff;border-left-color:#fff;background:rgba(255,255,255,.06);}
.nav-mono{width:30px;height:20px;border:1px solid var(--sidebar-line);display:flex;align-items:center;justify-content:center;font-size:9.5px;letter-spacing:.02em;color:var(--sidebar-ink-dim);flex-shrink:0;}
.nav-item.active .nav-mono{border-color:#fff;color:#fff;}
.sidebar-foot{padding:16px 24px;border-top:1px solid var(--sidebar-line);font-size:11.5px;color:var(--sidebar-ink-dim);}
.sidebar-foot .who{color:#e6e6e6;font-size:12.5px;margin-bottom:2px;}

.main{flex:1;min-width:0;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:28px 40px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.topbar h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0;}
.topbar .desc{font-size:13px;color:var(--ink-soft);margin-top:6px;max-width:660px;}
.topbar .actions{display:flex;gap:10px;flex-shrink:0;padding-top:2px;flex-wrap:wrap;}
.content{padding:32px 40px 90px;max-width:1180px;}
.crumb{font-size:12px;color:var(--ink-faint);margin-bottom:6px;}
.crumb button{background:none;border:none;color:var(--ink-faint);text-decoration:underline;cursor:pointer;font-size:12px;padding:0;font-family:var(--sans);}

.btn{font-family:var(--sans);font-size:13px;padding:9px 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;white-space:nowrap;}
.btn:hover{background:#000;}
.btn-outline{background:transparent;color:var(--ink);border:1px solid var(--line-strong);}
.btn-outline:hover{border-color:var(--ink);}
.btn-small{padding:5px 11px;font-size:12px;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:38px;}
.kpi{padding:20px 22px;border-left:1px solid var(--line);}
.kpi:first-child{border-left:none;}
.kpi .num{font-family:var(--serif);font-size:29px;font-variant-numeric:tabular-nums;}
.kpi .label{font-size:11.8px;color:var(--ink-soft);margin-top:5px;}
.kpi .delta{font-size:11.3px;margin-top:7px;color:var(--ink-faint);}

.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:44px 0 14px;flex-wrap:wrap;gap:6px;}
.section-head h2{font-family:var(--serif);font-weight:400;font-size:18px;margin:0;}
.section-head .hint{font-size:11.8px;color:var(--ink-faint);}
.section-head select{border:1px solid var(--line-strong);padding:6px 10px;font-size:12.5px;background:#fff;font-family:var(--sans);}

.table-wrap{overflow-x:auto;border-bottom:1px solid var(--line);}
table.ledger{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
table.ledger th{text-align:left;font-weight:500;color:var(--ink-soft);font-size:11.3px;padding:0 14px 10px;border-bottom:1px solid var(--ink);white-space:nowrap;}
table.ledger td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
table.ledger tbody tr{cursor:pointer;}
table.ledger tbody tr:hover{background:var(--fill);}
table.ledger td.num, table.ledger th.num{text-align:right;font-variant-numeric:tabular-nums;}
.tag{display:inline-block;font-size:10.8px;padding:2.5px 8px;border:1px solid var(--ink);white-space:nowrap;}
.tag.dim{border-color:var(--line-strong);color:var(--ink-soft);}
.row-actions{display:flex;gap:6px;}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);}
.dash-card{background:#fff;padding:22px;cursor:pointer;}
.dash-card:hover{background:var(--fill);}
.dash-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.dash-card .mono{width:34px;height:24px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:10px;}
.dash-card h4{font-family:var(--serif);font-weight:400;font-size:17px;margin:0 0 6px;}
.dash-card .meta{font-size:11.8px;color:var(--ink-soft);margin-bottom:14px;}
.bar{height:7px;background:var(--fill);border:1px solid var(--line-strong);position:relative;margin-bottom:6px;}
.bar-fill{height:100%;background:#111;}
.bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);}
.card-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;}
.modal{background:#fff;width:500px;max-width:100%;max-height:92vh;overflow-y:auto;padding:30px 32px;border:1px solid var(--ink);}
.modal h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 4px;}
.modal .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11.8px;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%;padding:9px 10px;border:1px solid var(--line-strong);font-family:var(--sans);font-size:13.5px;background:#fff;color:var(--ink);}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--ink);outline-offset:1px;}
.field textarea{min-height:70px;resize:vertical;}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:70;display:flex;justify-content:flex-end;}
.drawer{width:440px;max-width:94vw;background:#fff;height:100%;overflow-y:auto;padding:32px 34px;border-left:1px solid var(--ink);}
.drawer .eyebrow{font-size:11.5px;color:var(--ink-faint);margin-bottom:6px;}
.drawer h3{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 18px;}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;}
.kv .k{color:var(--ink-soft);flex-shrink:0;}
.kv .v{text-align:right;}
.drawer-actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;}
.close-x{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:0;}
.drawer-top{display:flex;justify-content:space-between;align-items:flex-start;}

.toast{position:fixed;bottom:26px;right:26px;background:#111;color:#fff;padding:13px 20px;font-size:13px;z-index:100;border:1px solid #000;}
.empty{padding:40px 0;text-align:center;color:var(--ink-faint);font-size:13px;border:1px dashed var(--line-strong);}
.menu-btn{display:none;border:1px solid var(--line-strong);background:#fff;padding:8px 10px;cursor:pointer;margin-right:12px;}
.title-row{display:flex;align-items:center;}

@media (max-width:820px){
  .sidebar{position:fixed;z-index:60;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .topbar,.content{padding-left:20px;padding-right:20px;}
  .menu-btn{display:inline-flex !important;}
  .two-col{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="toast-root"></div>

<script>
/* ============================= UTILITIES ============================= */
const $ = sel => document.querySelector(sel);
const money = n => '$' + Math.round(n).toLocaleString('en-US');
function toast(msg){
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ root.innerHTML=''; }, 2600);
}
function closeModal(){ $('#modal-root').innerHTML=''; }
function closeDrawer(){ $('#drawer-root').innerHTML=''; }

/* ============================= CONSTANTS ============================= */
const DEPARTMENTS = ['BD','Academics','SSD','IT Support','Finance','HR','Operations','RTE','Resource Management'];
const LOGISTICS_ITEMS = ['Venue','AV Equipment','Catering','Security','Transport','Signage & Printing'];
const STATUS_ORDER = {'Planning':0,'Confirmed':1,'Completed':2,'Cancelled':3};

/* ============================= STATE / MOCK DATA ============================= */
const state = {
  active:'dashboard',
  selectedEvent:0,
  taskDeptFilter:'All',
  events:[
    {
      name:'Annual Career Fair', initiatingDept:'BD', date:'14 Oct 2026', status:'Planning',
      description:'Campus-wide career fair connecting graduating students with regional employers across all diploma programs.',
      budgetAllocated:18000, budgetSpent:11200,
      logistics:[
        {item:'Venue', dept:'Operations', status:'Confirmed'},
        {item:'AV Equipment', dept:'IT Support', status:'Pending'},
        {item:'Catering', dept:'Resource Management', status:'Confirmed'},
        {item:'Security', dept:'Operations', status:'Pending'},
      ],
      team:[
        {name:'Tomás Reyes', dept:'BD', role:'Event lead'},
        {name:'IT Support Desk', dept:'IT Support', role:'Hardware & Wi-Fi setup'},
        {name:'SSD Coordination Team', dept:'SSD', role:'Student registration & coordination'},
        {name:'Resource Mgmt Team', dept:'Resource Management', role:'Catering & supplies'},
      ],
      tasks:[
        {title:'Set up hardware & Wi-Fi access points', assignedTo:'IT Support Desk', dept:'IT Support', due:'10 Oct 2026', status:'In progress'},
        {title:'Coordinate student registration desk', assignedTo:'SSD Coordination Team', dept:'SSD', due:'12 Oct 2026', status:'Pending'},
        {title:'Confirm employer booth layout', assignedTo:'Tomás Reyes', dept:'BD', due:'01 Oct 2026', status:'Done'},
        {title:'Arrange catering for 300 guests', assignedTo:'Resource Mgmt Team', dept:'Resource Management', due:'13 Oct 2026', status:'Pending'},
      ],
    },
    {
      name:'Founders Day Alumni Gala', initiatingDept:'BD', date:'21 Nov 2026', status:'Planning',
      description:'Evening gala for alumni and corporate partners marking the college’s founding anniversary.',
      budgetAllocated:42000, budgetSpent:9500,
      logistics:[
        {item:'Venue', dept:'Operations', status:'Confirmed'},
        {item:'Security', dept:'Operations', status:'Confirmed'},
        {item:'AV Equipment', dept:'IT Support', status:'Pending'},
        {item:'Signage & Printing', dept:'Resource Management', status:'Pending'},
      ],
      team:[
        {name:'Grace Lin', dept:'HR', role:'Guest list & invitations'},
        {name:'IT Support Desk', dept:'IT Support', role:'Stage AV & livestream'},
        {name:'Operations Team', dept:'Operations', role:'Venue & security coordination'},
        {name:'Finance Office', dept:'Finance', role:'Sponsorship payment processing'},
      ],
      tasks:[
        {title:'Finalize alumni invitation list', assignedTo:'Grace Lin', dept:'HR', due:'01 Oct 2026', status:'In progress'},
        {title:'Set up stage AV & livestream feed', assignedTo:'IT Support Desk', dept:'IT Support', due:'18 Nov 2026', status:'Pending'},
        {title:'Process sponsor payment confirmations', assignedTo:'Finance Office', dept:'Finance', due:'05 Nov 2026', status:'Pending'},
      ],
    },
    {
      name:'New Student Orientation Week', initiatingDept:'SSD', date:'18 Aug 2026', status:'Completed',
      description:'Week-long orientation program welcoming incoming students across all departments.',
      budgetAllocated:12000, budgetSpent:11850,
      logistics:[
        {item:'Venue', dept:'Operations', status:'Confirmed'},
        {item:'AV Equipment', dept:'IT Support', status:'Confirmed'},
        {item:'Catering', dept:'Resource Management', status:'Confirmed'},
      ],
      team:[
        {name:'SSD Coordination Team', dept:'SSD', role:'Event lead'},
        {name:'Dr. Priya Nandakumar', dept:'Academics', role:'Program schedule & faculty intros'},
        {name:'IT Support Desk', dept:'IT Support', role:'Account activation stations'},
        {name:'Grace Lin', dept:'HR', role:'Staff volunteer roster'},
      ],
      tasks:[
        {title:'Print orientation packets', assignedTo:'SSD Coordination Team', dept:'SSD', due:'12 Aug 2026', status:'Done'},
        {title:'Set up account activation stations', assignedTo:'IT Support Desk', dept:'IT Support', due:'15 Aug 2026', status:'Done'},
        {title:'Coordinate faculty welcome sessions', assignedTo:'Dr. Priya Nandakumar', dept:'Academics', due:'16 Aug 2026', status:'Done'},
      ],
    },
    {
      name:'Research Symposium', initiatingDept:'RTE', date:'09 Dec 2026', status:'Planning',
      description:'Annual symposium showcasing faculty and student research output to industry partners.',
      budgetAllocated:9000, budgetSpent:2100,
      logistics:[
        {item:'Venue', dept:'Operations', status:'Pending'},
        {item:'AV Equipment', dept:'IT Support', status:'Pending'},
        {item:'Catering', dept:'Resource Management', status:'Pending'},
      ],
      team:[
        {name:'RTE Coordinator', dept:'RTE', role:'Event lead'},
        {name:'IT Support Desk', dept:'IT Support', role:'Presentation AV setup'},
        {name:'Dr. Priya Nandakumar', dept:'Academics', role:'Faculty presenter coordination'},
      ],
      tasks:[
        {title:'Book auditorium and breakout rooms', assignedTo:'RTE Coordinator', dept:'RTE', due:'01 Nov 2026', status:'Pending'},
        {title:'Test presentation AV in all rooms', assignedTo:'IT Support Desk', dept:'IT Support', due:'05 Dec 2026', status:'Pending'},
      ],
    },
  ],
};

/* ============================= NAV / TITLES ============================= */
const NAV = [
  {id:'dashboard', label:'Overview', mono:'OV'},
  {id:'events', label:'Event Manager', mono:'EM'},
  {id:'tasks', label:'Task Board', mono:'TB'},
];
const TITLES = {
  dashboard:{title:'Cross-departmental events overview', desc:'Every campus event in flight, its budget position, and open tasks across all initiating and supporting departments.'},
  events:{title:'Collaborative Event Manager', desc:'Any department can create a campus event, set its budget, and allocate the logistics it needs from other branches.'},
  tasks:{title:'Cross-Department Member Tagging & Task Assignments', desc:'Invite staff from other departments onto an event and delegate specific tasks — tracked in one place across every event.'},
};

/* ============================= HELPERS ============================= */
function allTasks(){
  const out = [];
  state.events.forEach((ev, ei) => ev.tasks.forEach((t, ti) => out.push({...t, eventIdx:ei, taskIdx:ti, eventName:ev.name})));
  return out;
}
function taskCompletion(ev){
  if(!ev.tasks.length) return 0;
  return Math.round((ev.tasks.filter(t=>t.status==='Done').length / ev.tasks.length) * 100);
}
function statusTag(status){
  if(status==='Confirmed'||status==='Done'||status==='Completed') return `<span class="tag">${status}</span>`;
  if(status==='In progress') return `<span class="tag">${status}</span>`;
  return `<span class="tag dim">${status}</span>`;
}

/* ============================= DASHBOARD ============================= */
function renderDashboard(){
  const active = state.events.filter(e=>e.status==='Planning'||e.status==='Confirmed').length;
  const totalAlloc = state.events.reduce((a,e)=>a+e.budgetAllocated,0);
  const totalSpent = state.events.reduce((a,e)=>a+e.budgetSpent,0);
  const openTasks = allTasks().filter(t=>t.status!=='Done').length;
  return `
    <div class="kpi-row">
      <div class="kpi"><div class="num">${active}</div><div class="label">Active events</div></div>
      <div class="kpi"><div class="num">${money(totalAlloc)}</div><div class="label">Total budget allocated</div></div>
      <div class="kpi"><div class="num">${money(totalSpent)}</div><div class="label">Total spent to date</div></div>
      <div class="kpi"><div class="num">${openTasks}</div><div class="label">Open cross-department tasks</div></div>
    </div>
    <div class="section-head"><h2>All events</h2><span class="hint">${state.events.length} events · click a card to open</span></div>
    ${renderEventGrid(state.events)}
  `;
}
function renderEventGrid(list){
  if(!list.length) return `<div class="empty">No events yet. Use “+ New event” to create one.</div>`;
  return `<div class="dash-grid">
    ${list.map(ev=>{
      const idx = state.events.indexOf(ev);
      const pctSpent = Math.min(100, Math.round((ev.budgetSpent/ev.budgetAllocated)*100));
      const completion = taskCompletion(ev);
      return `<div class="dash-card" onclick="openEvent(${idx})">
        <div class="top-row"><div class="mono">${ev.initiatingDept.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>${statusTag(ev.status)}</div>
        <h4>${ev.name}</h4>
        <div class="meta">Initiated by ${ev.initiatingDept} · ${ev.date}</div>
        <div class="bar-label"><span>Budget used</span><span>${pctSpent}%</span></div>
        <div class="bar"><div class="bar-fill" style="width:${pctSpent}%"></div></div>
        <div class="card-foot"><span>${ev.logistics.length} logistics items</span><span>${completion}% tasks done</span></div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ============================= FEATURE 1: EVENT MANAGER (list) ============================= */
function renderEvents(){
  return `
    <div class="section-head"><h2>All events</h2><span class="hint">${state.events.length} events across ${new Set(state.events.map(e=>e.initiatingDept)).size} initiating departments</span></div>
    ${renderEventGrid(state.events)}
  `;
}
function openEventModal(){
  $('#modal-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>Create campus event</h3>
      <div class="sub">Any department can initiate an event, set its budget, and mark which logistics it will need from other branches.</div>
      <form onsubmit="submitEvent(event)">
        <div class="field"><label>Event name</label><input name="name" required placeholder="e.g. Winter Trades Showcase"></div>
        <div class="two-col">
          <div class="field"><label>Initiating department</label><select name="dept">${DEPARTMENTS.map(d=>`<option>${d}</option>`).join('')}</select></div>
          <div class="field"><label>Event date</label><input name="date" required placeholder="e.g. 05 Feb 2027"></div>
        </div>
        <div class="field"><label>Budget allocated ($)</label><input name="budget" type="number" min="0" required placeholder="0"></div>
        <div class="field"><label>Description</label><textarea name="description" placeholder="What is this event for?"></textarea></div>
        <div class="field"><label>Logistics needed</label>
          <div class="check-grid">
            ${LOGISTICS_ITEMS.map((l,i)=>`<label class="check-row"><input type="checkbox" name="logi" value="${l}" ${i<2?'checked':''}> ${l}</label>`).join('')}
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Create event</button>
        </div>
      </form>
    </div>
  </div>`;
}
function submitEvent(e){
  e.preventDefault();
  const f = e.target;
  const logi = Array.from(f.querySelectorAll('input[name="logi"]:checked')).map(c=>c.value);
  if(!logi.length){ toast('Select at least one logistics item.'); return; }
  state.events.unshift({
    name:f.name.value, initiatingDept:f.dept.value, date:f.date.value, status:'Planning',
    description:f.description.value||'', budgetAllocated:+f.budget.value||0, budgetSpent:0,
    logistics: logi.map(l=>({item:l, dept:'Unassigned', status:'Pending'})),
    team:[{name:f.dept.value+' Lead', dept:f.dept.value, role:'Event lead'}],
    tasks:[],
  });
  closeModal();
  if(state.active==='events'||state.active==='dashboard') renderContent();
  toast('Event created.');
}

/* ============================= EVENT DETAIL PAGE ============================= */
function openEvent(idx){
  state.selectedEvent = idx;
  state.active = 'event';
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.getAttribute('data-id')==='events'));
  renderTopbar();
  renderContent();
  window.scrollTo(0,0);
}
function backToEvents(){ navigate('events'); }
function renderEventTopbar(ev){
  return `
    <div>
      <div class="crumb"><button onclick="backToEvents()">Event Manager</button> / ${ev.name}</div>
      <div class="title-row"><button class="menu-btn" onclick="toggleSidebar()">&#9776;</button><h1>${ev.name}</h1></div>
      <div class="desc">Initiated by ${ev.initiatingDept} · ${ev.date} · ${ev.description}</div>
    </div>
    <div class="actions">
      <span class="tag" style="align-self:center;">${ev.status}</span>
      <button class="btn btn-outline" onclick="logSpend(${state.selectedEvent})">Log spend</button>
      <button class="btn btn-outline" onclick="openInviteModal(${state.selectedEvent})">+ Invite member</button>
      <button class="btn" onclick="openTaskModal(${state.selectedEvent})">+ Assign task</button>
    </div>
  `;
}
function renderEventDetail(){
  const ev = state.events[state.selectedEvent];
  const remaining = ev.budgetAllocated - ev.budgetSpent;
  const completion = taskCompletion(ev);
  return `
    <div class="kpi-row">
      <div class="kpi"><div class="num">${money(ev.budgetAllocated)}</div><div class="label">Budget allocated</div></div>
      <div class="kpi"><div class="num">${money(ev.budgetSpent)}</div><div class="label">Spent to date</div></div>
      <div class="kpi"><div class="num">${money(remaining)}</div><div class="label">Remaining</div><div class="delta">${remaining<0?'Over budget':'On budget'}</div></div>
      <div class="kpi"><div class="num">${completion}%</div><div class="label">Tasks completed</div></div>
    </div>

    <div class="section-head"><h2>Logistics allocation</h2><span class="hint">${ev.logistics.length} items · click a row to update status</span></div>
    <div class="table-wrap"><table class="ledger"><thead><tr>
      <th>Item</th><th>Responsible department</th><th>Status</th><th></th>
    </tr></thead><tbody>
      ${ev.logistics.map((l,i)=>`<tr onclick="openLogisticsDetail(${state.selectedEvent},${i})">
        <td>${l.item}</td><td>${l.dept}</td><td>${statusTag(l.status)}</td>
        <td class="row-actions">${l.status!=='Confirmed' ? `<button class="btn btn-small" onclick="event.stopPropagation();confirmLogistics(${state.selectedEvent},${i})">Confirm</button>` : ''}</td>
      </tr>`).join('')}
    </tbody></table></div>

    <div class="section-head"><h2>Team on this event</h2><span class="hint">${ev.team.length} people across ${new Set(ev.team.map(t=>t.dept)).size} departments</span></div>
    <div class="table-wrap"><table class="ledger"><thead><tr>
      <th>Name</th><th>Department</th><th>Role on this event</th>
    </tr></thead><tbody>
      ${ev.team.map(t=>`<tr onclick="event.stopPropagation()" style="cursor:default;">
        <td>${t.name}</td><td>${t.dept}</td><td>${t.role}</td>
      </tr>`).join('')}
    </tbody></table></div>

    <div class="section-head"><h2>Tasks &amp; delegated responsibilities</h2><span class="hint">${ev.tasks.length} tasks · click a row for detail</span></div>
    ${ev.tasks.length ? `<div class="table-wrap"><table class="ledger"><thead><tr>
      <th>Task</th><th>Assigned to</th><th>Department</th><th>Due</th><th>Status</th>
    </tr></thead><tbody>
      ${ev.tasks.map((t,i)=>`<tr onclick="openTaskDetail(${state.selectedEvent},${i})">
        <td>${t.title}</td><td>${t.assignedTo}</td><td>${t.dept}</td><td>${t.due}</td><td>${statusTag(t.status)}</td>
      </tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">No tasks assigned yet. Use “+ Assign task” above to delegate one.</div>`}
  `;
}
function logSpend(idx){
  $('#modal-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>Log spend</h3>
      <div class="sub">Record an expense against this event’s budget.</div>
      <form onsubmit="submitSpend(event,${idx})">
        <div class="field"><label>Amount ($)</label><input name="amount" type="number" min="0" required placeholder="0"></div>
        <div class="field"><label>Note (optional)</label><input name="note" placeholder="e.g. Deposit paid to caterer"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Log spend</button>
        </div>
      </form>
    </div>
  </div>`;
}
function submitSpend(e, idx){
  e.preventDefault();
  state.events[idx].budgetSpent += (+e.target.amount.value||0);
  closeModal();
  renderContent();
  toast('Spend logged.');
}
function openInviteModal(idx){
  $('#modal-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>Invite cross-department member</h3>
      <div class="sub">Tag a staff member from another department onto this event.</div>
      <form onsubmit="submitInvite(event,${idx})">
        <div class="field"><label>Name</label><input name="name" required placeholder="e.g. Wei Zhang"></div>
        <div class="field"><label>Department</label><select name="dept">${DEPARTMENTS.map(d=>`<option>${d}</option>`).join('')}</select></div>
        <div class="field"><label>Role on this event</label><input name="role" required placeholder="e.g. Hardware setup"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Send invite</button>
        </div>
      </form>
    </div>
  </div>`;
}
function submitInvite(e, idx){
  e.preventDefault();
  const f = e.target;
  state.events[idx].team.push({name:f.name.value, dept:f.dept.value, role:f.role.value});
  closeModal();
  renderContent();
  toast(`${f.name.value} invited from ${f.dept.value}.`);
}
function openTaskModal(idx){
  $('#modal-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>Assign task</h3>
      <div class="sub">Delegate a specific responsibility to a person or team on this event.</div>
      <form onsubmit="submitTask(event,${idx})">
        <div class="field"><label>Task</label><input name="title" required placeholder="e.g. Print name badges"></div>
        <div class="two-col">
          <div class="field"><label>Assign to</label><input name="assignedTo" required placeholder="e.g. IT Support Desk"></div>
          <div class="field"><label>Department</label><select name="dept">${DEPARTMENTS.map(d=>`<option>${d}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label>Due date</label><input name="due" required placeholder="e.g. 01 Dec 2026"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Assign task</button>
        </div>
      </form>
    </div>
  </div>`;
}
function submitTask(e, idx){
  e.preventDefault();
  const f = e.target;
  state.events[idx].tasks.unshift({title:f.title.value, assignedTo:f.assignedTo.value, dept:f.dept.value, due:f.due.value, status:'Pending'});
  closeModal();
  renderContent();
  toast('Task assigned.');
}
function openLogisticsDetail(eIdx, lIdx){
  const l = state.events[eIdx].logistics[lIdx];
  $('#drawer-root').innerHTML = `<div class="drawer-overlay" onclick="if(event.target===this)closeDrawer()">
    <div class="drawer">
      <div class="drawer-top"><div><div class="eyebrow">Logistics item</div><h3>${l.item}</h3></div><button class="close-x" onclick="closeDrawer()">&times;</button></div>
      <div class="kv"><span class="k">Responsible department</span><span class="v">${l.dept}</span></div>
      <div class="kv"><span class="k">Status</span><span class="v">${l.status}</span></div>
      <div class="drawer-actions">
        ${l.status==='Pending' ? `<button class="btn" onclick="setLogisticsStatus(${eIdx},${lIdx},'In progress')">Mark in progress</button>` : ''}
        ${l.status!=='Confirmed' ? `<button class="btn ${l.status==='Pending'?'btn-outline':''}" onclick="setLogisticsStatus(${eIdx},${lIdx},'Confirmed')">Confirm</button>` : ''}
        <button class="btn btn-outline" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>`;
}
function setLogisticsStatus(eIdx, lIdx, status){
  state.events[eIdx].logistics[lIdx].status = status;
  closeDrawer();
  renderContent();
  toast(`${state.events[eIdx].logistics[lIdx].item} marked ${status.toLowerCase()}.`);
}
function confirmLogistics(eIdx, lIdx){
  state.events[eIdx].logistics[lIdx].status = 'Confirmed';
  renderContent();
  toast('Logistics item confirmed.');
}
function openTaskDetail(eIdx, tIdx){
  const t = state.events[eIdx].tasks[tIdx];
  const ev = state.events[eIdx];
  $('#drawer-root').innerHTML = `<div class="drawer-overlay" onclick="if(event.target===this)closeDrawer()">
    <div class="drawer">
      <div class="drawer-top"><div><div class="eyebrow">${ev.name}</div><h3>${t.title}</h3></div><button class="close-x" onclick="closeDrawer()">&times;</button></div>
      <div class="kv"><span class="k">Assigned to</span><span class="v">${t.assignedTo}</span></div>
      <div class="kv"><span class="k">Department</span><span class="v">${t.dept}</span></div>
      <div class="kv"><span class="k">Due</span><span class="v">${t.due}</span></div>
      <div class="kv"><span class="k">Status</span><span class="v">${t.status}</span></div>
      <div class="drawer-actions">
        ${t.status==='Pending' ? `<button class="btn" onclick="setTaskStatus(${eIdx},${tIdx},'In progress')">Start task</button>` : ''}
        ${t.status!=='Done' ? `<button class="btn ${t.status==='Pending'?'btn-outline':''}" onclick="setTaskStatus(${eIdx},${tIdx},'Done')">Mark done</button>` : ''}
        <button class="btn btn-outline" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>`;
}
function setTaskStatus(eIdx, tIdx, status){
  state.events[eIdx].tasks[tIdx].status = status;
  closeDrawer();
  if(state.active==='event') renderContent(); else renderContent();
  toast(`Task marked "${status}".`);
}

/* ============================= FEATURE 2: TASK BOARD (cross-event) ============================= */
function renderTasks(){
  const all = allTasks();
  const filtered = state.taskDeptFilter==='All' ? all : all.filter(t=>t.dept===state.taskDeptFilter);
  const pending = all.filter(t=>t.status==='Pending').length;
  const inProgress = all.filter(t=>t.status==='In progress').length;
  const done = all.filter(t=>t.status==='Done').length;
  return `
    <div class="kpi-row">
      <div class="kpi"><div class="num">${all.length}</div><div class="label">Total delegated tasks</div></div>
      <div class="kpi"><div class="num">${pending}</div><div class="label">Pending</div></div>
      <div class="kpi"><div class="num">${inProgress}</div><div class="label">In progress</div></div>
      <div class="kpi"><div class="num">${done}</div><div class="label">Done</div></div>
    </div>
    <div class="section-head">
      <h2>All tasks across events</h2>
      <select onchange="setTaskFilter(this.value)">
        <option ${state.taskDeptFilter==='All'?'selected':''}>All</option>
        ${DEPARTMENTS.map(d=>`<option ${state.taskDeptFilter===d?'selected':''}>${d}</option>`).join('')}
      </select>
    </div>
    ${filtered.length ? `<div class="table-wrap"><table class="ledger"><thead><tr>
      <th>Task</th><th>Event</th><th>Assigned to</th><th>Department</th><th>Due</th><th>Status</th>
    </tr></thead><tbody>
      ${filtered.map(t=>`<tr onclick="openTaskDetail(${t.eventIdx},${t.taskIdx})">
        <td>${t.title}</td><td>${t.eventName}</td><td>${t.assignedTo}</td><td>${t.dept}</td><td>${t.due}</td><td>${statusTag(t.status)}</td>
      </tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">No tasks for this department yet.</div>`}
  `;
}
function setTaskFilter(v){ state.taskDeptFilter = v; renderContent(); }
function openTaskModalGlobal(){
  $('#modal-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>Assign task</h3>
      <div class="sub">Delegate a responsibility to a person or team, tied to one of the events below.</div>
      <form onsubmit="submitTaskGlobal(event)">
        <div class="field"><label>Event</label><select name="eventIdx">${state.events.map((ev,i)=>`<option value="${i}">${ev.name}</option>`).join('')}</select></div>
        <div class="field"><label>Task</label><input name="title" required placeholder="e.g. Print name badges"></div>
        <div class="two-col">
          <div class="field"><label>Assign to</label><input name="assignedTo" required placeholder="e.g. IT Support Desk"></div>
          <div class="field"><label>Department</label><select name="dept">${DEPARTMENTS.map(d=>`<option>${d}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label>Due date</label><input name="due" required placeholder="e.g. 01 Dec 2026"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Assign task</button>
        </div>
      </form>
    </div>
  </div>`;
}
function submitTaskGlobal(e){
  e.preventDefault();
  const f = e.target;
  const idx = +f.eventIdx.value;
  state.events[idx].tasks.unshift({title:f.title.value, assignedTo:f.assignedTo.value, dept:f.dept.value, due:f.due.value, status:'Pending'});
  closeModal();
  renderContent();
  toast('Task assigned to ' + state.events[idx].name + '.');
}

/* ============================= TOP-LEVEL RENDER ============================= */
function renderSidebar(){
  $('#sidebar').innerHTML = `
    <div class="brand">
      <div class="brand-mark">ING College OS</div>
      <div class="brand-sub">Collaborative Events Console — Northgate College</div>
    </div>
    <nav class="nav">
      ${NAV.map(n=>`<button class="nav-item" data-id="${n.id}" onclick="navigate('${n.id}')"><span class="nav-mono">${n.mono}</span>${n.label}</button>`).join('')}
    </nav>
    <div class="sidebar-foot">
      <div class="who">Signed in as Event Coordinator</div>
      Northgate College · All departments
    </div>
  `;
}
function renderTopbar(){
  if(state.active==='event'){
    $('#topbar').innerHTML = renderEventTopbar(state.events[state.selectedEvent]);
    return;
  }
  const t = TITLES[state.active];
  let actionsHtml = '';
  if(state.active==='events') actionsHtml = `<button class="btn" onclick="openEventModal()">+ New event</button>`;
  else if(state.active==='tasks') actionsHtml = `<button class="btn" onclick="openTaskModalGlobal()">+ Assign task</button>`;
  $('#topbar').innerHTML = `
    <div>
      <div class="title-row"><button class="menu-btn" onclick="toggleSidebar()">&#9776;</button><h1>${t.title}</h1></div>
      <div class="desc">${t.desc}</div>
    </div>
    <div class="actions">${actionsHtml}</div>
  `;
}
function renderContent(){
  let html = '';
  if(state.active==='dashboard') html = renderDashboard();
  else if(state.active==='events') html = renderEvents();
  else if(state.active==='event') html = renderEventDetail();
  else if(state.active==='tasks') html = renderTasks();
  $('#content').innerHTML = html;
}
function navigate(id){
  state.active = id;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-id')===id);
  });
  renderTopbar();
  renderContent();
  closeModal(); closeDrawer();
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

/* ============================= INIT ============================= */
renderSidebar();
navigate('dashboard');
</script>
</body>
</html>
